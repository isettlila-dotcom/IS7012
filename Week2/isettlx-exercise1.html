<html>
<head>
<title>Food Order Form</title>
<style>
body {
font-family: Georgia;
background-color: lightyellow;
}
h1 {
color: darkred;
font-size: 32px;
}
h2 {
color: brown;
font-size: 22px;
}
form {
background-color: white;
padding: 20px;
}
p {
font-size: 16px;
}
</style>
</head>
<body>
<h1>Food Order Form</h1>
<form>
<h2>Pizza</h2>
<p>Choose a pizza:</p>
<select>
<option>Cheese - $10</option>
<option>Pepperoni - $12</option>
<option>Veggie - $11</option>
</select>
<p>Quantity:</p>
<input type="text">

<h2>Sides</h2>
<p>Choose a side:</p>
<select>
<option>Breadsticks - $6</option>
<option>Wings - $8</option>
<option>Salad - $5</option>
</select>
<p>Quantity:</p>
<input type="text">

<h2>Drinks</h2>
<p>Choose a drink:</p>
<select>
<option>Water - $2</option>
<option>Soda - $3</option>
<option>Lemonade - $3</option>
</select>
<p>Quantity:</p>
<input type="text">

<p><input type="submit" value="Submit Order"></p>
</form>
</body>
</html>
